apiVersion: v1
kind: Namespace
metadata:
  name: lesson-05
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lesson-05
spec:
  replicas: 4
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        app: web
      annotations:
        kubernetes.io/change-cause: "initial 1.27"
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
