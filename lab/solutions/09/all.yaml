apiVersion: v1
kind: Namespace
metadata:
  name: lesson-09
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lesson-09
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lesson-09
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
# No virtual IP: DNS hands back every Ready Pod IP, and the client chooses.
apiVersion: v1
kind: Service
metadata:
  name: web-headless
  namespace: lesson-09
spec:
  clusterIP: None
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: web-sticky
  namespace: lesson-09
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Pure DNS indirection: a cluster-local name for something outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: upstream
  namespace: lesson-09
spec:
  type: ExternalName
  externalName: example.com
