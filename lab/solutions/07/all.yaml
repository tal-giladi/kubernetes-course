apiVersion: v1
kind: Namespace
metadata:
  name: lesson-07
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-probe
  namespace: lesson-07
spec:
  selector:
    matchLabels:
      app: node-probe
  template:
    metadata:
      labels:
        app: node-probe
    spec:
      # Without this the control-plane node's NoSchedule taint keeps the agent off it,
      # and you monitor two nodes out of three without noticing.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: probe
          image: busybox:1.37
          command: ["sh", "-c", "while true; do sleep 3600; done"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pi
  namespace: lesson-07
spec:
  completions: 3
  parallelism: 2
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: work
          image: busybox:1.37
          command: ["sh", "-c", "echo computing; sleep 3; echo done"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: heartbeat
  namespace: lesson-07
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: beat
              image: busybox:1.37
              command: ["sh", "-c", "date; echo heartbeat"]
