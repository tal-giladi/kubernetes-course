apiVersion: v1
kind: Namespace
metadata:
  name: lesson-06
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: lesson-06
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: hello:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "1.1.0"
            - name: GREETING
              value: shalom
