apiVersion: v1
kind: Namespace
metadata:
  name: lesson-12
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: lesson-12
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  # No storageClassName: the cluster's default (kind's local-path) is used.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  namespace: lesson-12
spec:
  # One replica on purpose: the claim is ReadWriteOnce, so a second Pod on another node
  # would never start. Per-replica storage is what StatefulSets are for.
  replicas: 1
  selector:
    matchLabels:
      app: writer
  template:
    metadata:
      labels:
        app: writer
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
      containers:
        - name: hello
          image: hello:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scratch
  namespace: lesson-12
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scratch
  template:
    metadata:
      labels:
        app: scratch
    spec:
      volumes:
        # Same mount path, same app, no persistence at all.
        - name: data
          emptyDir: {}
      containers:
        - name: hello
          image: hello:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
