apiVersion: v1
kind: Namespace
metadata:
  name: lesson-18
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: lesson-18
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "5"
    count/deployments.apps: "2"
---
# Mutating: fills in what the manifest left blank, then validates against max/min.
# Without this, the quota above would REJECT every Pod that omits requests.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: lesson-18
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 500m
        memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: lesson-18
spec:
  replicas: 2
  selector: { matchLabels: { app: hello } }
  template:
    metadata:
      labels: { app: hello }
    spec:
      containers:
        - name: hello
          image: hello:1.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          # Deliberately no resources block - compare this template with the resulting Pod.
