apiVersion: v1
kind: Namespace
metadata:
  name: lesson-19
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: lesson-19
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: lesson-19
rules:
  - apiGroups: [""]                    # "" is the core group
    resources: ["pods", "pods/log"]    # a subresource is its own resource name
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reader-can-read-pods
  namespace: lesson-19
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
subjects:
  - kind: ServiceAccount
    name: reader
    namespace: lesson-19
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: lesson-19
spec:
  replicas: 1
  selector: { matchLabels: { app: hello } }
  template:
    metadata:
      labels: { app: hello }
    spec:
      # The Pod now speaks to the API as system:serviceaccount:lesson-19:reader,
      # with exactly the three verbs granted above and nothing else.
      serviceAccountName: reader
      containers:
        - name: hello
          image: hello:1.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
