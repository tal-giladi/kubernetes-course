# Four Deployments, four different failures. Apply this, then diagnose from the cluster.
# No peeking at the fixes in lab/solutions/23/fixed.yaml until you have a theory for each.
apiVersion: v1
kind: Namespace
metadata:
  name: lesson-23
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: lesson-23
spec:
  replicas: 2
  selector: { matchLabels: { app: app-a } }
  template:
    metadata:
      labels: { app: app-a }
    spec:
      containers:
        - name: hello
          image: hello:1.4.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          resources: { requests: { cpu: 20m, memory: 64Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-b
  namespace: lesson-23
spec:
  replicas: 2
  selector: { matchLabels: { app: app-b } }
  template:
    metadata:
      labels: { app: app-b }
    spec:
      containers:
        - name: hello
          image: hello:1.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          resources: { requests: { cpu: 20m, memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: app-b
  namespace: lesson-23
spec:
  selector:
    app: appb
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-c-config
  namespace: lesson-23
data:
  greeting: hello-from-configmap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-c
  namespace: lesson-23
spec:
  replicas: 2
  selector: { matchLabels: { app: app-c } }
  template:
    metadata:
      labels: { app: app-c }
    spec:
      containers:
        - name: hello
          image: hello:1.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  name: app-c-config
                  key: GREETING
          resources: { requests: { cpu: 20m, memory: 64Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-d
  namespace: lesson-23
spec:
  replicas: 1
  selector: { matchLabels: { app: app-d } }
  template:
    metadata:
      labels: { app: app-d }
    spec:
      containers:
        - name: hello
          image: hello:1.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests:
              cpu: "24"
              memory: 64Mi
