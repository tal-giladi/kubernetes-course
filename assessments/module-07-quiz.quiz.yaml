  question: What does Kustomize's `configMapGenerator` name hash buy you?
  options:
    - It deduplicates ConfigMaps across namespaces, saving quota
    - It encrypts the ConfigMap so it can hold secrets
    - A config change renames the ConfigMap, changing the Pod template and triggering a rollout, so Pods never keep stale env vars
    - It pins the ConfigMap so Pods keep old config during rollbacks
  correct: 2
- source: d97d85dec8ae
  question: "You add `commonLabels: {env: prod}` to an overlay and `kubectl apply -k` fails with `field is immutable`. Why, and what is the fix?"
  options:
    - Labels can't change on existing objects; delete and recreate them
    - "`env` is a reserved label key; rename it"
    - "`apply -k` doesn't support overlays; pipe `kubectl kustomize` to `kubectl replace`"
    - "`commonLabels` also changes the immutable `spec.selector.matchLabels`; use `labels:` with `includeSelectors: false`"
  correct: 3
