  question: Someone fixed an incident with `kubectl edit deploy web` on a Helm-managed release. What happens at the next `helm upgrade`?
  options:
    - Helm always reverts every manual edit
    - "It depends: the three-way merge keeps fields the chart doesn't mention and reverts ones it does, so put fixes in the chart"
    - Helm always keeps manual edits
    - The upgrade fails with a conflict until you run `helm rollback`
  correct: 1
