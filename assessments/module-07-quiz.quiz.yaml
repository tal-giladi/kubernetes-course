- source: d4fbe6f0ff92
  question: What is the difference between `version` and `appVersion` in `Chart.yaml`?
  options:
    - "`version` is the app's version; `appVersion` is the chart's API version"
    - They must always match and are bumped together
    - "`version` is the chart's own version (templates, defaults); `appVersion` is the version of the software it deploys"
    - "`version` is the minimum Helm version; `appVersion` is the chart's version"
  correct: 2
- source: aa62a304d49a
  question: A teammate debugs a chart by running `helm install` repeatedly. Which two commands are better, and what does each catch?
  options:
    - "`helm template` renders locally (template and YAML errors); `helm install --dry-run --debug` also checks with the API server (schema, admission)"
    - "`helm upgrade --force` shows errors; `helm rollback` catches schema problems"
    - "`helm status` renders templates; `helm get values` catches admission rejections"
    - "`helm template` checks with the API server; `helm lint` renders against a live cluster"
  correct: 0
- source: da9d02e32d34
  question: "`helm rollback shop 1` succeeds and `helm history shop` shows four revisions. Why aren't you *at* revision 1?"
  options:
    - Rollback deleted revisions 2 and 3, and history shows a stale cache
    - Revision 4 is a backup Helm makes before every rollback
    - The rollback partly failed, so Helm created revision 4 to retry
    - Rollback re-applies revision 1's manifest as a new revision 4; history records what you did, not what you had
  correct: 3
