- source: 0f891d621a4a
  question: "An HPA shows `TARGETS: <unknown>/70%` and never scales. What are the two causes, in the order you check them?"
  options:
    - The target is too high, then the Deployment has too few replicas
    - metrics-server is missing or unhealthy, then the container has no CPU request
