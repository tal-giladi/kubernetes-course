- source: 631126624bf2
  question: "A node drain hangs on a disruption budget. Service X has 6 replicas and `minAvailable: 50%`; service Y has 1 replica and `minAvailable: 1`. Which blocks, and what is the fix?"
  options:
    - "X, because 50% of 6 cannot be evicted; set `minAvailable: 3`"
    - Both, because any PDB blocks a drain
    - "Y; run at least 2 replicas or use `maxUnavailable: 1`"
    - Neither; drains ignore PDBs and the message is a warning
  correct: 2
